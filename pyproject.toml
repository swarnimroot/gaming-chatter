[project]
name = "gaming-chatter"
version = "0.1.0"
description = "Personal gaming-news aggregator: daily ingest + Monday weekly exec summary"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "apscheduler>=3.10",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "scrapers-lib",
]

[tool.uv.sources]
scrapers-lib = { path = "../scrapers-lib", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
